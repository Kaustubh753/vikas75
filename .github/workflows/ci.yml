name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Read-only token: this job installs and runs the repo's own checks and needs nothing else.
# Without it the workflow inherits the repository default, which may be read/write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Plain-node unit tests for the pure logic: the AI judge (with its position-bias oracle)
      # and the shared standings ranking (with its board-agrees-with-podium oracle).
      - run: npm test
      - run: npm run build
