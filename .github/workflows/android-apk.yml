name: Build Android APK (TWA)

# Builds a signed Trusted Web Activity APK/AAB from apk/twa-manifest.json using Bubblewrap.
# Run it from the Actions tab (workflow_dispatch) or by pushing an `apk-v*` tag. The built
# package is uploaded as a workflow artifact. See apk/README.md for the full guide, including
# the (easier, no-toolchain) PWABuilder path and how to wire the signing-key fingerprint into
# /.well-known/assetlinks.json.
#
# Required repo secrets for a RELEASE build (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of your release keystore  (`base64 -w0 android.keystore`)
#   ANDROID_KEYSTORE_PASSWORD   the keystore (store) password
#   ANDROID_KEY_PASSWORD        the key password (often the same)
# The key alias must be `vikas75` to match apk/twa-manifest.json (or change it there).
# With no keystore secret the job still runs, generating a throwaway key so you get a testable
# APK — but its fingerprint won't match production assetlinks, so that build shows a URL bar.

on:
  workflow_dispatch:
  push:
    tags: ['apk-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the runner's JDK and Android SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          { "jdkPath": "${JAVA_HOME}", "androidSdkPath": "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" }
          EOF
          echo "Bubblewrap config:"; cat "$HOME/.bubblewrap/config.json"

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd apk
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "Using provided release keystore."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — generating a throwaway keystore. The APK installs and runs, but its fingerprint won't match your production assetlinks (the TWA will show a URL bar). Add the secret for a release build."
            keytool -genkeypair -v -keystore android.keystore -alias vikas75 \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass changeit -keypass changeit \
              -dname "CN=Vikas 75, O=Office of Sujeet Kumar, C=IN"
          fi

      - name: Build and sign
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'changeit' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'changeit' }}
        run: |
          cd apk
          # Regenerate the Android project from twa-manifest.json, then compile + sign. Bubblewrap
          # downloads iconUrl/maskableIconUrl from the LIVE site during generation, so the `host`
          # in twa-manifest.json must be deployed and reachable before this runs.
          bubblewrap update --skipVersionUpgrade || bubblewrap update || true
          bubblewrap build --skipPwaValidation

      - name: Show signing-key SHA-256 fingerprint (for assetlinks)
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'changeit' }}
        run: |
          cd apk
          echo "── Set TWA_SHA256_CERT_FINGERPRINTS on your deploy host to this SHA-256 value ──"
          keytool -list -v -keystore android.keystore -alias vikas75 -storepass "$STOREPASS" \
            | grep -i 'SHA256:' || echo "(could not read fingerprint — check the keystore alias/password)"

      - name: Upload APK / AAB
        uses: actions/upload-artifact@v4
        with:
          name: vikas75-android
          path: |
            apk/*.apk
            apk/*.aab
          if-no-files-found: error
          retention-days: 14
