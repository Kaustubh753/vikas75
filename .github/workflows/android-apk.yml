name: Build Android APK (TWA)

# Builds a signed Trusted Web Activity APK/AAB from apk/twa-manifest.json using Bubblewrap.
# Run it from the Actions tab (workflow_dispatch) or by pushing an `apk-v*` tag. The built
# package is uploaded as a workflow artifact. See apk/README.md for the full guide, including
# the (easier, no-toolchain) PWABuilder path and how to wire the signing-key fingerprint into
# /.well-known/assetlinks.json.
#
# Required repo secrets for a RELEASE build (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of your release keystore  (`base64 -w0 android.keystore`)
#   ANDROID_KEYSTORE_PASSWORD   the keystore (store) password
#   ANDROID_KEY_PASSWORD        the key password (often the same)
# The key alias must be `vikas75` to match apk/twa-manifest.json (or change it there).
# With no keystore secret the job still runs, generating a throwaway key so you get a testable
# APK — but its fingerprint won't match production assetlinks, so that build shows a URL bar.

on:
  workflow_dispatch:
  push:
    tags: ['apk-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        # Pinned for reproducibility — bump deliberately after testing a new release.
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Point Bubblewrap at the runner's JDK and Android SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          { "jdkPath": "${JAVA_HOME}", "androidSdkPath": "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" }
          EOF
          echo "Bubblewrap config:"; cat "$HOME/.bubblewrap/config.json"

      # The release keystore's passwords are NEVER written to $GITHUB_ENV. Anything in GITHUB_ENV
      # becomes an environment variable for every later step in the job — including `bubblewrap
      # update/build`, which runs third-party CLI code and pulls Gradle plugins — so a secret put
      # there is readable by all of it. Each step that genuinely needs a password now takes it
      # from `secrets.*` directly, and THROWAWAY (below) carries the only thing the steps need to
      # know: whether this is a real release build or a generated test key.
      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Alias defaults to vikas75; override with an ANDROID_KEY_ALIAS repo variable if your
          # keystore uses a different one — twa-manifest.json is patched to match below.
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'vikas75' }}
        run: |
          cd apk
          echo "ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          # Keep twa-manifest.json's signingKey.alias in step with the alias we actually sign with,
          # so Bubblewrap (which reads the alias from the manifest) and keytool never disagree.
          node -e "const f='twa-manifest.json',m=require('./'+f);m.signingKey.alias=process.env.KEY_ALIAS;require('fs').writeFileSync(f,JSON.stringify(m,null,2))"
          if [ -n "$KEYSTORE_B64" ]; then
            # A release keystore was supplied — its passwords MUST be supplied too, or signing fails
            # with a confusing error. Fail early and clearly instead.
            if [ -z "$STORE_PW" ] || [ -z "$KEY_PW" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD and/or ANDROID_KEY_PASSWORD are missing. Set all three, and make sure the keystore's key alias is '$KEY_ALIAS' (matching twa-manifest.json / the ANDROID_KEY_ALIAS variable)."
              exit 1
            fi
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "THROWAWAY=false" >> "$GITHUB_ENV"
            echo "Using provided release keystore (alias '$KEY_ALIAS')."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — generating a throwaway keystore. The APK installs and runs, but its fingerprint won't match your production assetlinks (the TWA will show a URL bar). Add the secret for a release build."
            keytool -genkeypair -v -keystore android.keystore -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass changeit -keypass changeit \
              -dname "CN=Vikas 75, O=Office of Sujeet Kumar, C=IN"
            echo "THROWAWAY=true" >> "$GITHUB_ENV"
          fi

      - name: Build and sign
        env:
          # Straight from secrets, scoped to this step only. `changeit` is the throwaway key's
          # password, used only when no release keystore was supplied.
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apk
          if [ "$THROWAWAY" = "true" ]; then
            export BUBBLEWRAP_KEYSTORE_PASSWORD=changeit BUBBLEWRAP_KEY_PASSWORD=changeit
          else
            export BUBBLEWRAP_KEYSTORE_PASSWORD="$STORE_PW" BUBBLEWRAP_KEY_PASSWORD="$KEY_PW"
          fi
          # `bubblewrap build` compiles an EXISTING project — it does not scaffold — so `update`
          # first to (re)generate the Android project from twa-manifest.json. Bubblewrap downloads
          # iconUrl/maskableIconUrl from the LIVE site here, so `host` must be deployed and
          # reachable. Errors are not swallowed: if generation genuinely fails we want it to fail
          # loudly at the real cause. (If a Bubblewrap version can't scaffold via update, use
          # PWABuilder — see apk/README.md Option A.)
          bubblewrap update
          bubblewrap build --skipPwaValidation

      - name: Show signing-key SHA-256 fingerprint (for assetlinks)
        env:
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd apk
          if [ "$THROWAWAY" = "true" ]; then STORE_PW=changeit; fi
          echo "── Set TWA_SHA256_CERT_FINGERPRINTS on your deploy host to this SHA-256 value ──"
          keytool -list -v -keystore android.keystore -alias "$ALIAS" -storepass "$STORE_PW" \
            | grep -i 'SHA256:' || echo "(could not read fingerprint — check the keystore alias/password)"

      - name: Upload APK / AAB
        uses: actions/upload-artifact@v4
        with:
          name: vikas75-android
          path: |
            apk/*.apk
            apk/*.aab
          if-no-files-found: error
          retention-days: 14
